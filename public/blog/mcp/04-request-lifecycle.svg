<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Request lifecycle</title><desc id="d">Sequence diagram. The user asks a question; the host asks its client for tools; the client optionally calls server/discover, then tools/list; the model picks a tool; the client sends tools/call; the server calls the backend API with a Bearer token and returns the result; the host answers the user.</desc><defs>
