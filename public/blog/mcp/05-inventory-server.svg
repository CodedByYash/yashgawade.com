<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Inventory MCP server in context</title><desc id="d">Claude Desktop launches the Inventory MCP server as a local stdio process. The server exposes five read-only and three write tools, and calls the Inventory API with a service-account Bearer token. The API owns authentication, validation and business rules, and reads and writes MongoDB.</desc><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b8b94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><text x="800" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" fill="#09090b" text-anchor="middle">My inventory MCP server in context</text>
<rect x="40" y="330" width="300" height="220" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="190" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#09090b" text-anchor="middle">Claude Desktop</text>
<text x="190" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" fill="#52525b" text-anchor="middle">host + client</text>
<text x="190" y="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#52525b" text-anchor="middle">launches the server</text>
<line x1="340" y1="440" x2="480" y2="440" stroke="#2563eb" stroke-width="3.5" marker-end="url(#aa)"/>
<text x="410" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#2563eb" text-anchor="middle">stdio</text>
<rect x="480" y="130" width="400" height="640" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="680" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#2563eb" text-anchor="middle">Inventory MCP server</text>
<text x="680" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#52525b" text-anchor="middle">thin, well-described adapter</text>
<text x="510" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="700" fill="#09090b" text-anchor="start">Read-only tools · 5</text>
<text x="510" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#09090b" text-anchor="start">check_stock</text>
<text x="510" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#09090b" text-anchor="start">search_products</text>
<text x="510" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#09090b" text-anchor="start">get_low_stock_alerts</text>
