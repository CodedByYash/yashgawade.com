<rect x="500" y="530" width="360" height="3" rx="1" fill="#d4d4d8" stroke="none" stroke-width="2"/>
<text x="510" y="580" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="700" fill="#b45309" text-anchor="start">Write tools · 3</text>
<text x="510" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#b45309" text-anchor="start">create_purchase_order</text>
<text x="510" y="658" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#b45309" text-anchor="start">receive_purchase_order</text>
