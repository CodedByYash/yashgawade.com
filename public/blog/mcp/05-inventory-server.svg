<rect x="505" y="715" width="350" height="40" rx="10" fill="#f4f4f5" stroke="none" stroke-width="2"/>
<text x="680" y="743" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#52525b" text-anchor="middle">Resolvers: SKU · warehouse · PO</text>
<line x1="880" y1="440" x2="1070" y2="440" stroke="#2563eb" stroke-width="3.5" marker-end="url(#aa)"/>
<text x="975" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#2563eb" text-anchor="middle">HTTP</text>
<text x="975" y="486" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#52525b" text-anchor="middle">Bearer token</text>
<text x="975" y="516" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#52525b" text-anchor="middle">service account</text>
<rect x="1070" y="310" width="240" height="260" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1190" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#09090b" text-anchor="middle">Inventory API</text>
<text x="1190" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" fill="#52525b" text-anchor="middle">auth</text>
<text x="1190" y="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" fill="#52525b" text-anchor="middle">validation</text>
<text x="1190" y="496" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" fill="#52525b" text-anchor="middle">stock ledger</text>
<text x="1190" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" fill="#52525b" text-anchor="middle">business rules</text>
<line x1="1310" y1="440" x2="1410" y2="440" stroke="#8b8b94" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1410" y="370" width="150" height="140" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1485" y="432" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="700" fill="#09090b" text-anchor="middle">MongoDB</text>
<text x="1485" y="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#52525b" text-anchor="middle">data</text>
<rect x="1070" y="606" width="240" height="48" rx="24" fill="#dbeafe" stroke="none" stroke-width="0"/>
<text x="1190" y="638" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#2563eb" text-anchor="middle">Rules live here</text>
<text x="1190" y="690" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#52525b" text-anchor="middle">one source of truth for</text>
<text x="1190" y="720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#52525b" text-anchor="middle">the web app and the AI</text>
<text x="800" y="850" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#09090b" text-anchor="middle">The MCP server translates. The API decides.</text></svg>
