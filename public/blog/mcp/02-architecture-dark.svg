<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Host, clients and servers</title><desc id="d">A host application contains an LLM and several MCP clients. Each client connects to exactly one MCP server: server A is local over stdio, servers B and C are remote over Streamable HTTP.</desc><defs>
