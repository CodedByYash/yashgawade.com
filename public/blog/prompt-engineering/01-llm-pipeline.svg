<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">From prompt to response</title><desc id="d">Your prompt is split into tokens by a tokenizer. A transformer model uses attention across the tokens in its context window to predict the next token. That token is appended and the loop repeats until the response is complete.</desc><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b8b94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><text x="800" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" fill="#09090b" text-anchor="middle">What happens when you press enter</text>
<rect x="330" y="200" width="870" height="375" rx="24" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="10 8"/>
<text x="365" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" fill="#52525b" text-anchor="start">Context window: everything the model can see at once</text>
<rect x="51" y="300" width="250" height="150" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="176" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#09090b" text-anchor="middle">Your prompt</text>
<text x="176" y="408" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#52525b" text-anchor="middle">text in</text>
<line x1="307" y1="375" x2="357" y2="375" stroke="#8b8b94" stroke-width="3.5" marker-end="url(#ah)"/>
<rect x="363" y="300" width="250" height="150" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="488" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#09090b" text-anchor="middle">Tokenizer</text>
<text x="488" y="408" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#52525b" text-anchor="middle">text to tokens</text>
<line x1="619" y1="375" x2="669" y2="375" stroke="#8b8b94" stroke-width="3.5" marker-end="url(#ah)"/>
<rect x="675" y="300" width="250" height="150" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="800" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#2563eb" text-anchor="middle">Transformer</text>
<text x="800" y="408" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#52525b" text-anchor="middle">weighs every token</text>
<line x1="931" y1="375" x2="981" y2="375" stroke="#8b8b94" stroke-width="3.5" marker-end="url(#ah)"/>
<rect x="987" y="300" width="250" height="150" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1112" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#09090b" text-anchor="middle">Next token</text>
<text x="1112" y="408" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#52525b" text-anchor="middle">most likely piece</text>
<line x1="1243" y1="375" x2="1293" y2="375" stroke="#8b8b94" stroke-width="3.5" marker-end="url(#ah)"/>
<rect x="1299" y="300" width="250" height="150" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1424" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#09090b" text-anchor="middle">Response</text>
<text x="1424" y="408" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#52525b" text-anchor="middle">text out</text>
<path d="M1112 450 V500 H800 V458" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#aa)"/>
<text x="956" y="536" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#2563eb" text-anchor="middle">append the token, then repeat</text>
<text x="800" y="640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" fill="#52525b" text-anchor="middle">The sentence “Explain machine learning in simple terms.” becomes tokens like these</text>
<rect x="255.5" y="670" width="163" height="60" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="337" y="709" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="400" fill="#09090b" text-anchor="middle">Explain</text>
<rect x="432.5" y="670" width="180" height="60" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="522.5" y="709" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="400" fill="#09090b" text-anchor="middle">machine</text>
<rect x="626.5" y="670" width="197" height="60" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="725" y="709" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="400" fill="#09090b" text-anchor="middle">learning</text>
<rect x="837.5" y="670" width="95" height="60" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="885" y="709" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="400" fill="#09090b" text-anchor="middle">in</text>
<rect x="946.5" y="670" width="163" height="60" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1028" y="709" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="400" fill="#09090b" text-anchor="middle">simple</text>
<rect x="1123.5" y="670" width="146" height="60" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1196.5" y="709" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="400" fill="#09090b" text-anchor="middle">terms</text>
<rect x="1283.5" y="670" width="61" height="60" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1314" y="709" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="400" fill="#09090b" text-anchor="middle">.</text>
<text x="800" y="818" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#09090b" text-anchor="middle">The model never sees your intent, only the tokens you give it.</text></svg>
