<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Prompt evaluation loop</title><desc id="d">Six steps: define the objective, set success criteria, write test cases, run the prompt, score the results, then refine and retest, repeating until the prompt passes. Each run checks accuracy, relevance, completeness, format, consistency and safety.</desc><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
