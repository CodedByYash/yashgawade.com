<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">The investigation loop</title><desc id="d">Four steps: investigate the target with REA, understand the evidence, recreate the behavior in your own code, validate with tests. If validation shows a mismatch, return to investigation.</desc><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7aa2ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><text x="800" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" fill="#fafafa" text-anchor="middle">Investigate, understand, recreate, validate</text>
<rect x="40" y="230" width="330" height="270" rx="22" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<rect x="76" y="258" width="48" height="48" rx="24" fill="#1e2a4a" stroke="none" stroke-width="0"/>
<text x="100" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#7aa2ff" text-anchor="middle">1</text>
<text x="205" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#fafafa" text-anchor="middle">Investigate</text>
<text x="205" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle">agent traces the target</text>
<text x="205" y="436" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle">with REA's tools</text>
<rect x="420" y="230" width="330" height="270" rx="22" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<rect x="456" y="258" width="48" height="48" rx="24" fill="#1e2a4a" stroke="none" stroke-width="0"/>
<text x="480" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#7aa2ff" text-anchor="middle">2</text>
<text x="585" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#fafafa" text-anchor="middle">Understand</text>
<text x="585" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle">evidence → explanation</text>
<text x="585" y="436" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle">observed vs inferred</text>
<rect x="800" y="230" width="330" height="270" rx="22" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
<rect x="836" y="258" width="48" height="48" rx="24" fill="#1e2a4a" stroke="none" stroke-width="0"/>
<text x="860" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#7aa2ff" text-anchor="middle">3</text>
<text x="965" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#fafafa" text-anchor="middle">Recreate</text>
<text x="965" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle">write your own version</text>
<text x="965" y="436" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle">no copied code or assets</text>
<rect x="1180" y="230" width="330" height="270" rx="22" fill="#1e2a4a" stroke="#7aa2ff" stroke-width="3.5"/>
<rect x="1216" y="258" width="48" height="48" rx="24" fill="#18181b" stroke="none" stroke-width="0"/>
<text x="1240" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#7aa2ff" text-anchor="middle">4</text>
<text x="1345" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#7aa2ff" text-anchor="middle">Validate</text>
<text x="1345" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle">tests against the</text>
<text x="1345" y="436" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle">verified behavior</text>
<line x1="372" y1="365" x2="418" y2="365" stroke="#7aa2ff" stroke-width="3.5" marker-end="url(#aa)"/>
<line x1="752" y1="365" x2="798" y2="365" stroke="#7aa2ff" stroke-width="3.5" marker-end="url(#aa)"/>
<line x1="1132" y1="365" x2="1178" y2="365" stroke="#7aa2ff" stroke-width="3.5" marker-end="url(#aa)"/>
<path d="M1345 500 V610 H205 V506" fill="none" stroke="#7aa2ff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#aa)"/>
<rect x="515" y="586" width="520" height="48" rx="24" fill="#3a2a0a" stroke="none" stroke-width="0"/>
<text x="775" y="618" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="600" fill="#fbbf24" text-anchor="middle">mismatch? go back and investigate the gap</text>
<rect x="150" y="690" width="1300" height="120" rx="18" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
<text x="800" y="742" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#fafafa" text-anchor="middle">You stay in charge of the questions, the legal scope and the final call.</text>
<text x="800" y="782" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#a1a1aa" text-anchor="middle">The agent collects evidence. Tests decide whether the rebuild matches.</text></svg>
