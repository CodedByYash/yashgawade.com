<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Prompt, context and harness engineering</title><desc id="d">Prompt engineering (what the model should do) sits inside context engineering (what the model should know), which sits inside harness engineering (how the work is executed, kept safe and verified).</desc><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b8b94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><text x="800" y="56" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" fill="#09090b" text-anchor="middle">Three disciplines, nested</text>
<rect x="60" y="100" width="1480" height="730" rx="28" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="2"/>
<text x="110" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#09090b" text-anchor="start">Harness engineering</text>
<text x="110" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="400" fill="#52525b" text-anchor="start">How does the work get done, safely and verified?</text>
<text x="110" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#52525b" text-anchor="start">tools · permissions · loop · memory · verification · observability</text>
<rect x="160" y="290" width="1280" height="500" rx="24" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="210" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#09090b" text-anchor="start">Context engineering</text>
<text x="210" y="398" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="400" fill="#52525b" text-anchor="start">What should the model know?</text>
<text x="210" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#52525b" text-anchor="start">files · schema · docs · history · tool results</text>
<rect x="260" y="480" width="1080" height="270" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="310" y="548" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#2563eb" text-anchor="start">Prompt engineering</text>
<text x="310" y="588" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="400" fill="#52525b" text-anchor="start">What should the model do?</text>
<text x="310" y="628" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="400" fill="#52525b" text-anchor="start">task · role · constraints · output format · examples</text>
<text x="310" y="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#09090b" text-anchor="start">You need all three. A great prompt cannot fix a missing sandbox.</text></svg>
