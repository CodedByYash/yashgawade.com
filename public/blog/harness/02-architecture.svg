<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Anatomy of an AI harness</title><desc id="d">A user request enters the harness runtime. The context manager feeds the model; the model returns a tool call or a final answer. Tool calls pass through permission checks to a tool executor that acts on the environment; results update state and context. Final answers go to a verification layer: if it fails, the agent retries; if it passes, the final result is returned.</desc><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b8b94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><text x="800" y="56" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" fill="#09090b" text-anchor="middle">Anatomy of an AI harness</text>
<rect x="200" y="90" width="1060" height="570" rx="24" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="10 8"/>
<text x="232" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#09090b" text-anchor="start">Harness runtime</text>
<rect x="20" y="180" width="160" height="120" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="100" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#09090b" text-anchor="middle">User</text>
<text x="100" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#52525b" text-anchor="middle">request</text>
<rect x="240" y="170" width="240" height="120" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="360" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#09090b" text-anchor="middle">Context manager</text>
<text x="360" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#52525b" text-anchor="middle">selects what to show</text>
<rect x="600" y="170" width="240" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="720" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#2563eb" text-anchor="middle">Model</text>
<text x="720" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#52525b" text-anchor="middle">picks an action</text>
<rect x="960" y="170" width="250" height="120" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1085" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#09090b" text-anchor="middle">Permissions</text>
<text x="1085" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#52525b" text-anchor="middle">validate, allow or deny</text>
<rect x="240" y="420" width="240" height="120" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="360" y="475" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#09090b" text-anchor="middle">State &amp; memory</text>
<text x="360" y="510" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#52525b" text-anchor="middle">progress, notes</text>
<rect x="600" y="420" width="240" height="120" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="720" y="475" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#09090b" text-anchor="middle">Verification</text>
<text x="720" y="510" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#52525b" text-anchor="middle">tests, checks</text>
<rect x="960" y="420" width="250" height="120" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1085" y="475" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#09090b" text-anchor="middle">Tool executor</text>
<text x="1085" y="510" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#52525b" text-anchor="middle">files, shell, APIs</text>
<rect x="1330" y="420" width="250" height="120" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
<text x="1455" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#09090b" text-anchor="middle">Environment</text>
<text x="1455" y="508" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#52525b" text-anchor="middle">repo, database, web</text>
<rect x="600" y="720" width="240" height="100" rx="16" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="720" y="780" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Final result</text>
<line x1="180" y1="240" x2="240" y2="240" stroke="#8b8b94" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="480" y1="230" x2="600" y2="230" stroke="#8b8b94" stroke-width="3.5" marker-end="url(#ah)"/>
<line x1="840" y1="230" x2="960" y2="230" stroke="#2563eb" stroke-width="3.5" marker-end="url(#aa)"/>
<text x="900" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#2563eb" text-anchor="middle">tool call</text>
<line x1="1085" y1="290" x2="1085" y2="420" stroke="#2563eb" stroke-width="3.5" marker-end="url(#aa)"/>
<text x="1100" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#52525b" text-anchor="start">allowed</text>
<line x1="1210" y1="480" x2="1330" y2="480" stroke="#2563eb" stroke-width="3.5" marker-end="url(#aa)"/>
<text x="1270" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#2563eb" text-anchor="middle">act</text>
<path d="M1085 540 V600 H360 V548" fill="none" stroke="#8b8b94" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="960" y="584" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#52525b" text-anchor="middle">result</text>
<line x1="360" y1="420" x2="360" y2="296" stroke="#8b8b94" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="374" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#52525b" text-anchor="start">updated context</text>
<line x1="720" y1="290" x2="720" y2="420" stroke="#8b8b94" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="736" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#52525b" text-anchor="start">final answer</text>
<line x1="720" y1="540" x2="720" y2="720" stroke="#2563eb" stroke-width="3.5" marker-end="url(#aa)"/>
<text x="736" y="690" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#2563eb" text-anchor="start">passed</text>
<path d="M600 480 H500 " fill="none" stroke="#8b8b94" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/>
<rect x="500" y="428" width="80" height="48" rx="24" fill="#fef3c7" stroke="none" stroke-width="0"/>
<text x="540" y="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#b45309" text-anchor="middle">retry</text>
<text x="800" y="872" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="400" fill="#52525b" text-anchor="middle">The model proposes. The harness decides what runs and whether the work counts.</text></svg>
